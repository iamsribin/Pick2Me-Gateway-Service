services:
  gateway-service:
    image: pick2me-gateway-service:1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-service
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - miro-backend

networks:
  miro-backend:
    external: true
